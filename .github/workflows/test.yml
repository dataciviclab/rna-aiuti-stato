name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[dev]"
      - name: Test parser
        run: make test
      - name: Test dashboard smoke
        # py_compile sulle pagine — nessuna dipendenza streamlit in CI
        run: make test-dashboard
