name: Pipeline

# Workflow standard del Lab (pipeline-reusable): runner GitHub effimero,
# nessuno stato. `pre-run` estrae il raw via ZIP, `run` esegue il toolkit
# (clean + mart), poi il riusabile fa GCS sync + registry PR.
#
# Il runner è effimero → il rebuild è completo (`make raw` = `--full`): la
# storia intera viene rigenerata da ZIP (~30× meno banda dell'XML).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 5 * *"

jobs:
  pipeline:
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "rna-aiuti-stato"
      install-extras: "dev"
      pre-run-command: "make raw"
      run-command: "make run-all"
      sync-pattern: "per-dataset"
      # La fonte blocca gli IP dei runner GitHub (connect timeout, non 403):
      # le richieste passano dal proxy condiviso del Lab.
      extra-env: "BLOCKED_SOURCE_PROXY=${{ vars.BLOCKED_SOURCE_PROXY }}"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
