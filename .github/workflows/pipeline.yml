name: pipeline
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anni aiuti (default=current: rigenera solo l'anno corrente da XML; il toolkit processa comunque tutti gli anni da data/derived)"
        required: false
        default: "current"
  schedule:
    # Mensile: full_batch rigenera solo l'anno corrente (i parquet storici
    # restano su data/derived, preservati da clean:false), poi il toolkit
    # processa TUTTI gli anni presenti.
    - cron: "0 6 5 * *"

concurrency:
  group: rna-pipeline-${{ github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    runs-on: [self-hosted, rna-arm64]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # clean:false — il default (clean:true) cancella i file gitignored
          # (data/derived/*) a ogni run. Gli storici 2017-N devono persistere
          # sul runner: full_batch rigenera solo l'anno corrente, il toolkit
          # processa TUTTI gli anni da data/derived.
          clean: false

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e "."

      # ── Genera parquet raw (XML → Parquet) ──────────────────────────────
      - name: Configure years (full_batch)
        id: years
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "range=--from $(date +%Y) --to $(date +%Y)" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.years }}" == "full" ]]; then
            echo "range=--full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.years }}" == "current" ]]; then
            echo "range=--from $(date +%Y) --to $(date +%Y)" >> "$GITHUB_OUTPUT"
          else
            IFS=',' read -ra YS <<< "${{ inputs.years }}"
            echo "range=--from ${YS[0]} --to ${YS[-1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full_batch (AIUTI)
        run: |
          python3 scripts/full_batch.py ${{ steps.years.outputs.range }} \
            --workers 4 -o data/derived/rna

      - name: Run full_batch (MISURE)
        run: |
          if [ -f data/derived/misure/misure.parquet ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/full_batch.py --misure --workers 4
          else
            echo "misure.parquet già presente — skip full_batch misure"
          fi

      - name: Generate MANIFEST (aiuti)
        run: python3 scripts/generate_manifest.py data/derived/rna data/derived/manifests

      - name: Generate MANIFEST (misure)
        run: python3 scripts/generate_manifest.py --misure data/derived/misure data/derived/manifests

      - name: Commit manifest aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/manifests/
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai manifest"
          else
            git commit -m "Aggiornamento manifest RNA"
            git push
          fi

      # ── Toolkit: clean + mart (raw = local_file su data/derived) ────────
      - name: Detect available years (aiuti)
        id: aiuti-years
        run: |
          YEARS=$(ls data/derived/rna/rna_*.parquet 2>/dev/null | \
            sed 's/.*rna_\([0-9]*\)\.parquet/\1/' | sort | tr '\n' ',' | sed 's/,$//')
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "years=$YEARS"

      - name: Run toolkit (aiuti)
        if: steps.aiuti-years.outputs.years != ''
        run: |
          toolkit run --config datasets/rna-aiuti-stato/dataset.yml \
            --years "${{ steps.aiuti-years.outputs.years }}"

      - name: Run toolkit (misure)
        if: hashFiles('data/derived/misure/misure.parquet') != ''
        run: |
          toolkit run --config datasets/rna-misure/dataset.yml

      # ── Push ONLY clean + mart (raw è locale, non pubblicato) ───────────
      - name: GCP Auth (WIF)
        id: gcp-auth
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != "" && env.GCP_SERVICE_ACCOUNT != ""
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.gcp-auth.outputs.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync clean + mart to GCS
        if: steps.gcp-auth.outputs.outcome == 'success'
        run: |
          # Exclude run records (_run/) e metadata: solo parquet pubblici su GCS.
          for slug in rna_aiuti_stato rna_misure; do
            for year in $(ls "out/data/clean/$slug/" 2>/dev/null); do
              gsutil -m rsync -r -x ".*/_(run|validate)/.*|.*/metadata\.json$" \
                "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/$slug/$year/"
            done
            for year in $(ls "out/data/mart/$slug/" 2>/dev/null); do
              gsutil -m rsync -r -x ".*/_(run|validate)/.*|.*/metadata\.json$" \
                "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/$slug/$year/"
            done
          done
          echo "✅ Synced clean+mart → gs://dataciviclab-{clean,mart}/<slug>/{year}/"

      # ── Registry (artifact catalogo) → draft PR (composite, stesso job) ──
      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
