name: pipeline

# Pipeline RNA — runner self-hosted `rna-arm64` (la VM che è anche il proxy
# per la fonte). Il raw è incrementale: si rigenera solo l'anno corrente, gli
# storici restano su data/derived (preservati da clean:false).
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anni aiuti (default=current: rigenera solo l'anno corrente; il toolkit processa comunque tutti gli anni da data/derived)"
        required: false
        default: "current"
  schedule:
    - cron: "0 6 5 * *"

concurrency:
  group: rna-pipeline-${{ github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: [self-hosted, rna-arm64]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # clean:false — il default (clean:true) cancella i file gitignored
          # (data/derived/*) a ogni run. Gli storici 2017-N devono persistere
          # sul runner: full_batch rigenera solo l'anno corrente.
          clean: false

      - name: Configure git HTTPS auth
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ github.token }}@github.com" > ~/.git-credentials

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e "."

      # ── GCP auth SUBITO ─────────────────────────────────────────────────
      # Il token OIDC di GitHub dura 5-10 min, ma il job ~14: se l'auth action
      # si limita a scrivere il file credenziali, lo scambio OIDC avviene al
      # primo uso (il sync, a fine job) e il token è già scaduto
      # ("token has invalid claims: token is expired").
      # Qui otteniamo subito un access token OAuth (1h) e lo usiamo alla fine.
      - name: GCP Auth (WIF → access token 1h)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      # ── Genera parquet raw (ZIP → Parquet) ──────────────────────────────
      - name: Configure years (full_batch)
        id: years
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "range=--from $(date +%Y) --to $(date +%Y)" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.years }}" == "full" ]]; then
            echo "range=--full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.years }}" == "current" ]]; then
            echo "range=--from $(date +%Y) --to $(date +%Y)" >> "$GITHUB_OUTPUT"
          else
            IFS=',' read -ra YS <<< "${{ inputs.years }}"
            echo "range=--from ${YS[0]} --to ${YS[-1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full_batch (AIUTI)
        run: |
          python3 scripts/full_batch.py ${{ steps.years.outputs.range }} \
            --workers 4 -o data/derived/rna

      - name: Run full_batch (MISURE)
        run: |
          if [ -f data/derived/misure/misure.parquet ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/full_batch.py --misure --workers 4
          else
            echo "misure.parquet già presente — skip full_batch misure"
          fi

      # ── Toolkit: clean + mart (raw = local_file su data/derived) ────────
      - name: Detect available years (aiuti)
        id: aiuti-years
        run: |
          YEARS=$(ls data/derived/rna/rna_*.parquet 2>/dev/null | \
            sed 's/.*rna_\([0-9]*\)\.parquet/\1/' | sort | tr '\n' ',' | sed 's/,$//')
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "years=$YEARS"

      - name: Run toolkit (aiuti)
        if: steps.aiuti-years.outputs.years != ''
        run: |
          toolkit run --config datasets/rna-aiuti-stato/dataset.yml \
            --years "${{ steps.aiuti-years.outputs.years }}"

      - name: Run toolkit (misure)
        if: hashFiles('data/derived/misure/misure.parquet') != ''
        run: |
          toolkit run --config datasets/rna-misure/dataset.yml

      # ── Push ONLY clean + mart (raw è locale, non pubblicato) ───────────
      # Diagnostica: quale credenziale usa davvero il sync.
      - name: Auth check (diagnostica)
        run: |
          gcloud auth list 2>&1 | sed -n '1,12p' || true
          gsutil version -l 2>/dev/null | grep -iE "pass cloud sdk credentials|config path" || true

      # NB: `gcloud storage`, NON `gsutil`. `gsutil` ignora l'access token
      # esportato dall'auth action (usa il file ADC → scambio OIDC → scaduto);
      # `gcloud storage` è il percorso documentato per l'access token.
      - name: Sync clean + mart to GCS
        run: |
          # Exclude run records (_run/) e metadata: solo parquet pubblici su GCS.
          for slug in rna_aiuti_stato rna_misure; do
            for year in $(ls "out/data/clean/$slug/" 2>/dev/null); do
              gcloud storage rsync -r -x ".*/_(run|validate)/.*|.*/metadata\\.json$" \
                "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/$slug/$year/"
            done
            for year in $(ls "out/data/mart/$slug/" 2>/dev/null); do
              gcloud storage rsync -r -x ".*/_(run|validate)/.*|.*/metadata\\.json$" \
                "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/$slug/$year/"
            done
          done
          echo "✅ Synced clean+mart → gs://dataciviclab-{clean,mart}/<slug>/{year}/"

      # ── Registry (artifact catalogo) → draft PR (composite, stesso job) ──
      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
