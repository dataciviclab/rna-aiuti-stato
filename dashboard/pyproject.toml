[project]
name = "rna-dashboard"
version = "0.1.0"
description = "Dashboard Streamlit per i dati RNA Aiuti di Stato"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
